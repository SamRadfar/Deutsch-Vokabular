# Cloudflare Worker for the V2 AI features (single-word suggestions and topic vocabulary lists).
# Model: Cloudflare Workers AI through the `AI` binding — NO API key; the free Workers plan includes
# 10,000 Neurons/day and requests simply fail (never bill) once they are used up. The word limits
# below keep the service inside that free allocation. No secret belongs in this file.
# Deploy (owner's Cloudflare account): see README.md.
name = "deutsch-vokabular-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

[vars]
FIREBASE_PROJECT_ID = "deutsch-vokabular"
# Exact origins of the app (live site, its firebaseapp.com alias, the current preview channel).
ALLOWED_ORIGINS = "https://deutsch-vokabular.web.app,https://deutsch-vokabular.firebaseapp.com,https://deutsch-vokabular--v202-test-ww73499n.web.app"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
LIMIT_PER_MINUTE = "12"
LIMIT_PER_DAY = "60"
LIMIT_GLOBAL_PER_DAY = "300"
# ≈ 34 Neurons per generated word with the model above → 300 words ≈ 10,000 Neurons (free allocation).
LIMIT_WORDS_PER_DAY = "300"
LIMIT_GLOBAL_WORDS_PER_DAY = "300"
# Never "true" in a deployed worker.
ALLOW_MOCK_PROVIDER = "false"

# Usage counters (rate and daily limits): `wrangler kv namespace create USAGE`, then put the id here.
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
