<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabular">
<meta name="theme-color" content="#f0f4fb">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Deutsch Vokabular · واژه‌نامه آلمانی</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   LIGHT THEME
══════════════════════════════════════════ */
:root {
  --bg:#f0f4fb;--sf:#ffffff;--sfalt:#f7f9fd;
  --br:#e2e8f4;--brs:#c4cfdf;
  --tp:#0d1b2e;--ts:#3a4a68;--tm:#7889a8;
  --row-odd:#ffffff;--row-even:#f7f9fd;--row-hov:#edf1fc;
  --chk-bg:#f0fdf4;
  --fn:'Inter',system-ui,sans-serif;
  --fp:'Noto Naskh Arabic','Tahoma',sans-serif;
  /* Architecture — indigo */
  --ac-arch:#3a56d4;--acl-arch:rgba(58,86,212,.10);
  --acg-arch:linear-gradient(135deg,#3a56d4,#6d28d9);
  --grp-arch:rgba(58,86,212,.06);--grp-b-arch:#3a56d4;
  /* Academic — amber */
  --ac-acad:#b45309;--acl-acad:rgba(180,83,9,.10);
  --acg-acad:linear-gradient(135deg,#d97706,#ef4444);
  --grp-acad:rgba(180,83,9,.06);--grp-b-acad:#b45309;
  /* Dreame — emerald */
  --ac-dreame:#047857;--acl-dreame:rgba(4,120,87,.10);
  --acg-dreame:linear-gradient(135deg,#059669,#0d9488);
  --grp-dreame:rgba(4,120,87,.06);--grp-b-dreame:#047857;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tp);font-family:var(--fn);font-size:14px;line-height:1.6;min-height:100vh}

/* ── HEADER ── */
.hdr{background:rgba(255,255,255,.94);border-bottom:1px solid var(--br);padding:12px 14px 0;position:sticky;top:0;z-index:200;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--br),0 2px 10px rgba(0,0,0,.06)}
.htop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--acg-arch);box-shadow:0 2px 8px rgba(58,86,212,.25)}
.atitle{font-size:clamp(14px,3.5vw,18px);font-weight:700;letter-spacing:-.3px;color:var(--tp)}
.asub{font-family:var(--fp);font-size:11px;color:var(--tm);margin-top:1px;direction:rtl}
.hright{display:flex;gap:8px;align-items:center}
.spill{font-size:11px;font-weight:600;background:var(--acl-arch);color:var(--ac-arch);padding:3px 10px;border-radius:20px;border:1px solid rgba(58,86,212,.2);white-space:nowrap}
.pwrap{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--tm)}
.po{width:60px;height:3px;background:var(--br);border-radius:2px;overflow:hidden}
.pi{height:100%;border-radius:2px;transition:width .5s ease;background:var(--acg-arch)}
.breset{font-size:11px;font-weight:500;color:var(--tm);background:transparent;border:1px solid var(--br);border-radius:6px;padding:3px 10px;cursor:pointer;transition:all .2s}
.breset:hover{border-color:var(--ac-arch);color:var(--ac-arch)}

/* ── MAIN TABS ── */
.mtabs{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mtabs::-webkit-scrollbar{display:none}
.mbtn{font-size:12px;font-weight:500;color:var(--tm);background:transparent;border:none;border-bottom:2.5px solid transparent;padding:9px 14px 10px;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.mbtn:hover{color:var(--ts)}
.mbtn[data-theme="arch"].active  {color:var(--ac-arch);  border-bottom-color:var(--ac-arch);  font-weight:700}
.mbtn[data-theme="acad"].active  {color:var(--ac-acad);  border-bottom-color:var(--ac-acad);  font-weight:700}
.mbtn[data-theme="dreame"].active{color:var(--ac-dreame);border-bottom-color:var(--ac-dreame);font-weight:700}

/* ── CONTENT ── */
.mcontent{padding:16px 12px 60px;max-width:1480px;margin:0 auto}
.mpanel{display:none}.mpanel.active{display:block}
.stw{background:var(--sf);border:1px solid var(--br);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)}

/* ── SUB-TAB NAV ── */
.stnav{display:flex;border-bottom:1px solid var(--br);overflow-x:auto;scrollbar-width:none;background:var(--sfalt);-webkit-overflow-scrolling:touch;padding:0 4px}
.stnav::-webkit-scrollbar{display:none}
.sbtn{font-size:11.5px;font-weight:500;color:var(--tm);background:transparent;border:none;border-bottom:2.5px solid transparent;padding:11px 12px 10px;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;display:flex;align-items:center;gap:5px}
.sbtn:hover{color:var(--ts);background:rgba(0,0,0,.03)}
[data-theme="arch"]   .sbtn.active{color:var(--ac-arch);  border-bottom-color:var(--ac-arch);  font-weight:700;background:var(--sf)}
[data-theme="acad"]   .sbtn.active{color:var(--ac-acad);  border-bottom-color:var(--ac-acad);  font-weight:700;background:var(--sf)}
[data-theme="dreame"] .sbtn.active{color:var(--ac-dreame);border-bottom-color:var(--ac-dreame);font-weight:700;background:var(--sf)}
.sctr{font-size:9.5px;font-weight:600;background:var(--br);color:var(--tm);padding:1px 5px;border-radius:8px;transition:all .2s}
[data-theme="arch"]   .sbtn.active .sctr{background:var(--acl-arch);  color:var(--ac-arch);  border:1px solid rgba(58,86,212,.2)}
[data-theme="acad"]   .sbtn.active .sctr{background:var(--acl-acad);  color:var(--ac-acad);  border:1px solid rgba(180,83,9,.2)}
[data-theme="dreame"] .sbtn.active .sctr{background:var(--acl-dreame);color:var(--ac-dreame);border:1px solid rgba(4,120,87,.2)}

/* ── SECTION INFO ── */
.stbody{display:none}.stbody.active{display:block}
.sinfo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--br);background:linear-gradient(90deg,var(--sfalt),var(--sf));flex-wrap:wrap}
.stitle{font-size:13.5px;font-weight:700;letter-spacing:-.2px;color:var(--tp)}
.sfa{font-family:var(--fp);font-size:11.5px;color:var(--tm);direction:rtl;margin-top:1px}
.sprogw{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;color:var(--tm);white-space:nowrap}
.mpo{width:48px;height:2px;background:var(--br);border-radius:2px;overflow:hidden}
.mpi{height:100%;border-radius:2px;transition:width .5s ease}
[data-theme="arch"]   .mpi{background:var(--acg-arch)}
[data-theme="acad"]   .mpi{background:var(--acg-acad)}
[data-theme="dreame"] .mpi{background:var(--acg-dreame)}

/* ── LEGEND ── */
.lgnd{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--br);background:var(--sfalt)}
.llbl{font-size:10px;font-weight:700;color:var(--tm);margin-right:3px;letter-spacing:.4px;text-transform:uppercase}
.tb{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:8px;white-space:nowrap;display:inline-block}
.bn {background:#eff2ff;color:#3730a3;border:1px solid #c7d2fe}
.bv {background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
.ba {background:#f0fdf4;color:#166534;border:1px solid #86efac}
.bau{background:#faf5ff;color:#6b21a8;border:1px solid #e9d5ff}
.bs {background:#fffbeb;color:#92400e;border:1px solid #fcd34d}

/* ── TABLE (desktop) ── */
.tscr{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tscr::-webkit-scrollbar{height:3px}
.tscr::-webkit-scrollbar-track{background:var(--sf)}
.tscr::-webkit-scrollbar-thumb{background:var(--brs);border-radius:2px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead{background:var(--tp)}
thead th{padding:10px 12px;font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;text-align:left;white-space:nowrap;color:rgba(255,255,255,.75);border-right:1px solid rgba(255,255,255,.08)}
thead th:last-child{border-right:none}
.rh{text-align:right!important;direction:rtl;font-family:var(--fp);text-transform:none;letter-spacing:0;font-size:11px;font-weight:600}
.cc{width:38px;text-align:center!important}
.cw{width:14%;min-width:120px}.ct{width:9%;min-width:82px}
.cf{width:11%;min-width:100px}.ce{width:24%;min-width:180px}
.ctr{width:19%;min-width:145px}.cp{width:17%;min-width:135px}
.col-speak{width:42px;min-width:42px;text-align:center!important}
tbody tr{border-bottom:1px solid var(--br);transition:background .12s}
tbody tr:nth-child(odd){background:var(--row-odd)}
tbody tr:nth-child(even){background:var(--row-even)}
tbody tr:hover{background:var(--row-hov)}
tbody tr.learned{background:var(--chk-bg)!important;opacity:.7}
tbody tr:last-child{border-bottom:none}
td{padding:10px 12px;vertical-align:middle;border-right:1px solid var(--br);font-size:13px;line-height:1.5}
td:last-child{border-right:none}

/* Checkbox */
.chkc{text-align:center;padding:9px 6px}
.vchk{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid var(--brs);border-radius:4px;background:white;cursor:pointer;position:relative;transition:all .2s;display:inline-block;vertical-align:middle}
[data-theme="arch"]   .vchk:checked{background:var(--ac-arch);  border-color:var(--ac-arch);  box-shadow:0 0 0 3px var(--acl-arch)}
[data-theme="acad"]   .vchk:checked{background:var(--ac-acad);  border-color:var(--ac-acad);  box-shadow:0 0 0 3px var(--acl-acad)}
[data-theme="dreame"] .vchk:checked{background:var(--ac-dreame);border-color:var(--ac-dreame);box-shadow:0 0 0 3px var(--acl-dreame)}
.vchk:checked::after{content:'';position:absolute;left:4px;top:1px;width:6px;height:10px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(43deg)}
[data-theme="arch"]   .vchk:hover:not(:checked){border-color:var(--ac-arch)}
[data-theme="acad"]   .vchk:hover:not(:checked){border-color:var(--ac-acad)}
[data-theme="dreame"] .vchk:hover:not(:checked){border-color:var(--ac-dreame)}

/* Cells */
.wrd{font-weight:600;font-size:13.5px;color:var(--tp);letter-spacing:-.1px}
.rtl{direction:rtl;text-align:right;font-family:var(--fp)}
.fa{font-weight:600;font-size:13px;color:var(--tp)}
.tr{font-size:12px;color:var(--ts);line-height:1.6}
.ex{font-size:12px;color:var(--ts);line-height:1.6;font-style:italic}
[data-theme="arch"]   .pr{font-size:12px;color:var(--ac-arch)}
[data-theme="acad"]   .pr{font-size:12px;color:var(--ac-acad)}
[data-theme="dreame"] .pr{font-size:12px;color:var(--ac-dreame)}

/* Group row */
.grp td{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;padding:6px 12px;border-right:none!important;border-left:3px solid}
[data-theme="arch"]   .grp td{background:var(--grp-arch)!important;  color:var(--ac-arch);  border-left-color:var(--ac-arch)}
[data-theme="acad"]   .grp td{background:var(--grp-acad)!important;  color:var(--ac-acad);  border-left-color:var(--ac-acad)}
[data-theme="dreame"] .grp td{background:var(--grp-dreame)!important;color:var(--ac-dreame);border-left-color:var(--ac-dreame)}
.learned .wrd{text-decoration:line-through;text-decoration-color:var(--brs);opacity:.5}
.learned .fa{opacity:.5}

/* Speak button */
.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;background:transparent;color:var(--tm);transition:all .2s;font-size:14px;flex-shrink:0}
[data-theme="arch"]   .speak-btn:hover{background:var(--acl-arch);  color:var(--ac-arch)}
[data-theme="acad"]   .speak-btn:hover{background:var(--acl-acad);  color:var(--ac-acad)}
[data-theme="dreame"] .speak-btn:hover{background:var(--acl-dreame);color:var(--ac-dreame)}
.speak-btn.speaking{animation:pulse-speak .6s ease-in-out infinite alternate}
[data-theme="arch"]   .speak-btn.speaking{color:var(--ac-arch);  background:var(--acl-arch)}
[data-theme="acad"]   .speak-btn.speaking{color:var(--ac-acad);  background:var(--acl-acad)}
[data-theme="dreame"] .speak-btn.speaking{color:var(--ac-dreame);background:var(--acl-dreame)}
@keyframes pulse-speak{from{opacity:.5;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
.speak-cell{text-align:center;padding:6px 4px;border-right:none}

/* ══════════════════════════════════════════
   MOBILE CARD LAYOUT ≤ 640px
══════════════════════════════════════════ */
@media(max-width:640px){
  .hdr{padding:10px 10px 0}
  .mcontent{padding:10px 8px 64px}
  .pwrap{display:none}
  .sbtn{padding:10px 10px;font-size:11px}
  .sctr{display:none}
  .lgnd{padding:6px 10px}

  /* Turn table rows into cards */
  .tscr{overflow:visible}
  table{display:block}
  thead{display:none}
  tbody{display:block}

  tbody tr{
    display:grid!important;
    grid-template-areas:
      "chk word  type"
      "chk pafa  pafa"
      "ex  ex    ex"
      "tr2 tr2   tr2"
      "pr  pr    spk";
    grid-template-columns:36px 1fr auto;
    grid-template-rows:auto auto auto auto auto;
    background:var(--sf)!important;
    border:1px solid var(--br)!important;
    border-radius:12px;
    margin-bottom:10px;
    box-shadow:0 1px 4px rgba(0,0,0,.06);
    overflow:hidden;
  }
  tbody tr.grp{
    display:block!important;
    border-radius:8px;
    margin-bottom:8px;
    box-shadow:none;
    border:none!important;
  }
  tbody tr.grp td{border-radius:8px;padding:6px 12px;font-size:9px;border-left-width:3px}
  tbody tr.learned{opacity:.65!important}

  td{border-right:none!important;border-bottom:none!important;padding:0}

  td.chkc       {grid-area:chk;display:flex!important;align-items:flex-start;justify-content:center;padding:14px 4px 0;background:transparent}
  td.wrd-cell   {grid-area:word;padding:12px 10px 4px 6px;font-weight:700;font-size:14px;color:var(--tp)}
  td.type-cell  {grid-area:type;padding:13px 10px 4px 0;text-align:right}
  td.fa-cell    {grid-area:pafa;direction:rtl;text-align:right;font-family:var(--fp);font-size:14px;font-weight:600;color:var(--tp);padding:2px 10px 10px 6px;border-bottom:1px solid var(--br)!important}
  td.ex-cell    {grid-area:ex;font-style:italic;font-size:12px;color:var(--ts);padding:8px 10px 4px}
  td.tr-cell    {grid-area:tr2;direction:rtl;text-align:right;font-family:var(--fp);font-size:12px;color:var(--ts);padding:2px 10px 8px}
  td.pr-cell    {grid-area:pr;direction:rtl;text-align:right;font-family:var(--fp);font-size:11.5px;padding:4px 10px 12px}
  td.speak-cell {grid-area:spk;text-align:right;padding:4px 8px 12px 0;border-right:none!important}
  [data-theme="arch"]   td.pr-cell{color:var(--ac-arch)}
  [data-theme="acad"]   td.pr-cell{color:var(--ac-acad)}
  [data-theme="dreame"] td.pr-cell{color:var(--ac-dreame)}
}

/* ── TABLET ── */
@media(min-width:641px) and (max-width:900px){
  .hdr{padding:12px 14px 0}
  .mcontent{padding:14px 10px 56px}
  .sbtn{padding:10px 11px;font-size:11.5px}
  td,thead th{padding:9px 10px}
}

</style>
</head>
<body>

<header class="hdr">
  <div class="htop">
    <div class="brand">
      <div class="brand-icon">📖</div>
      <div>
        <div class="atitle">Deutsch Vokabular</div>
        <div class="asub">واژه‌نامه تخصصی آلمانی — سطح B2/C1</div>
      </div>
    </div>
    <div class="hright">
      <span class="spill" id="tc">— واژه</span>
      <div class="pwrap">
        <div class="po"><div class="pi" id="pb" style="width:0%"></div></div>
        <span id="pl">0%</span>
      </div>
      <button class="breset" onclick="resetAll()">↺</button>
    </div>
  </div>
  <nav class="mtabs" id="mnav">
    <button class="mbtn active" data-main="arch"   data-theme="arch">🏛 Architecture</button>
    <button class="mbtn"        data-main="acad"   data-theme="acad">🎓 Architekturstudium</button>
    <button class="mbtn"        data-main="dreame" data-theme="dreame">🤖 Dreame</button>
  </nav>
</header>

<main class="mcontent" id="mcontent"></main>

<script>

/* ═══════════════════════════════════════════════════════
   DATA  —  each entry: [word, type, fa, example, translation, pronunciation]
   types: n=Nomen  v=Verb  a=Adjektiv  au=Ausdruck  s=Satz
═══════════════════════════════════════════════════════ */
const DATA = {

  arch: {
    label: '🏛 Architecture',
    theme: 'arch',
    tabs: [

      { id:'bau', icon:'🏗', label:'Bau & Konstruktion', fa:'ساخت و سازه',
        groups: [
          { label:'Wände · دیوارها', rows:[
            ['die Außenwand','n','دیوار خارجی','Die Außenwand muss gut gedämmt sein.','دیوار خارجی باید به خوبی عایق‌بندی شده باشد.','دی آوسن‌وند'],
            ['die Innenwand','n','دیوار داخلی','Die Innenwand wurde nachträglich eingezogen.','دیوار داخلی بعداً اضافه شد.','دی اینن‌وند'],
            ['die Tragwand','n','دیوار باربر','Diese Wand ist eine Tragwand – sie darf nicht entfernt werden.','این دیوار باربر است — نمی‌توان آن را برداشت.','دی تراگ‌وند'],
            ['nichttragende Wand','au','دیوار غیرباربر','Nichttragender Wände können flexibel umgeplant werden.','دیوارهای غیرباربر می‌توانند انعطاف‌پذیر تغییر پلان شوند.','نیشت‌تراگنده وند'],
            ['die Trennwand','n','دیوار جداکننده','Die Gipskarton-Trennwand kann einfach versetzt werden.','دیوار جداکننده گچ‌برد را می‌توان به آسانی جابه‌جا کرد.','دی ترن‌وند'],
            ['die Scherwand','n','دیوار برشی','Scherwände nehmen horizontale Wind- und Erdbebenlasten auf.','دیوارهای برشی نیروهای افقی باد و زلزله را جذب می‌کنند.','دی شِر‌وند'],
          ]},
          { label:'Tragelemente · عناصر باربر', rows:[
            ['die Stütze','n','ستون','Die Stützen tragen die Last der Decke ab.','ستون‌ها بار سقف را تحمل می‌کنند.','دی اشتوتسه'],
            ['der Balken','n','شاه‌تیر / تیر','Der Holzbalken überspannt eine Weite von sechs Metern.','تیر چوبی یک دهانه شش متری را می‌پوشاند.','در بالکِن'],
            ['der Unterzug','n','زیرتیر','Der Unterzug leitet Deckenlasten auf die Stützen weiter.','زیرتیر بارهای سقف را به ستون‌ها منتقل می‌کند.','در اونتر‌تسوگ'],
            ['der Träger','n','تیر / خرپا','Der Stahlträger wurde mit Brandschutzbeschichtung versehen.','تیر فولادی با پوشش ضدحریق تجهیز شد.','در ترِگر'],
            ['das Fundament','n','فونداسیون / پی','Das Fundament muss frostfrei gegründet werden.','فونداسیون باید بدون یخ‌زدگی پایه‌گذاری شود.','داس فوندامنت'],
            ['die Bodenplatte','n','دال کف','Die Bodenplatte wurde aus 30 cm starkem Stahlbeton hergestellt.','دال کف از بتن مسلح ۳۰ سانتی‌متری ساخته شد.','دی بودن‌پلاته'],

            ['aufladen','v','شارژ کردن','Der Akku wird an der Basisstation vollständig aufgeladen.','باتری در ایستگاه پایه به طور کامل شارژ می‌شود.','اوف‌لادن'],
            ['kartieren','v','نقشه‌برداری کردن','Der Roboter kartiert die Wohnung beim ersten Einsatz vollständig.','ربات در اولین استفاده آپارتمان را به طور کامل نقشه‌برداری می‌کند.','کارتیرن'],
          ]},
        ]
      },

    ]
  }

};

/* ═══════════════════════════════════════════════════════
   RENDER ENGINE
═══════════════════════════════════════════════════════ */
const TYPE_MAP = {n:'bn',v:'bv',a:'ba',au:'bau',s:'bs'};
const TYPE_LABEL = {n:'Nomen',v:'Verb',a:'Adjektiv',au:'Ausdruck',s:'Satz'};

function buildPanel(mainKey) {
  const section = DATA[mainKey];
  const theme = section.theme;

  const wrapper = document.createElement('div');
  wrapper.className = 'stw';
  wrapper.dataset.theme = theme;

  // Sub-tab nav
  const nav = document.createElement('div');
  nav.className = 'stnav';
  nav.id = `snav-${mainKey}`;

  section.tabs.forEach((tab, ti) => {
    const btn = document.createElement('button');
    btn.className = 'sbtn' + (ti === 0 ? ' active' : '');
    btn.dataset.sub = tab.id;
    btn.dataset.main = mainKey;
    btn.innerHTML = `${tab.icon} ${tab.label} <span class="sctr" id="ctr-${mainKey}-${tab.id}">—</span>`;
    nav.appendChild(btn);
  });

  wrapper.appendChild(nav);

  // Sub-tab bodies
  section.tabs.forEach((tab, ti) => {
    const body = document.createElement('div');
    body.className = 'stbody' + (ti === 0 ? ' active' : '');
    body.id = `subtab-${mainKey}-${tab.id}`;

    // Section info
    body.innerHTML = `
      <div class="sinfo">
        <div><div class="stitle">${tab.label}</div><div class="sfa">${tab.fa}</div></div>
        <div class="sprogw"><div class="mpo"><div class="mpi" id="mp-${mainKey}-${tab.id}" style="width:0%"></div></div><span id="mt-${mainKey}-${tab.id}">0/0</span></div>
      </div>
      <div class="lgnd"><span class="llbl">Wortart ·</span><span class="tb bn">Nomen</span><span class="tb bv">Verb</span><span class="tb ba">Adjektiv</span><span class="tb bau">Ausdruck</span></div>
    `;

    // Table
    const tscr = document.createElement('div');
    tscr.className = 'tscr';

    let html = `<table id="tbl-${mainKey}-${tab.id}"><thead><tr>
      <th class="cc">✓</th><th class="cw">Wort</th><th class="ct">Wortart</th>
      <th class="cf rh">فارسی</th><th class="ce">Beispiel auf Deutsch</th>
      <th class="ctr rh">ترجمه مثال</th><th class="cp rh">تلفظ فارسی</th>
      <th class="col-speak">🔊</th>
    </tr></thead><tbody>`;

    tab.groups.forEach(group => {
      html += `<tr class="grp"><td colspan="7">${group.label}</td></tr>`;
      group.rows.forEach(row => {
        const [word, type, fa, ex, tr2, pr] = row;
        const cls = TYPE_MAP[type] || 'bn';
        const lbl = TYPE_LABEL[type] || type;
        // clean word for speech: strip article (der/die/das) for better pronunciation
        const speechWord = word.replace(/^(der|die|das|ein|eine)\s+/i,'');
        html += `<tr>
          <td class="chkc"><input type="checkbox" class="vchk"></td>
          <td class="wrd wrd-cell">${word}</td>
          <td class="type-cell"><span class="tb ${cls}">${lbl}</span></td>
          <td class="rtl fa fa-cell">${fa}</td>
          <td class="ex ex-cell">${ex}</td>
          <td class="rtl tr tr-cell">${tr2}</td>
          <td class="rtl pr pr-cell">${pr}</td>
          <td class="speak-cell"><button class="speak-btn" data-word="${speechWord}" title="Aussprache anhören" onclick="speakWord(this)">🔊</button></td>
        </tr>`;
      });
    });

    html += `</tbody></table>`;
    tscr.innerHTML = html;
    body.appendChild(tscr);
    wrapper.appendChild(body);
  });

  return wrapper;
}

function init() {
  const mcontent = document.getElementById('mcontent');

  Object.keys(DATA).forEach((key, i) => {
    const panel = document.createElement('div');
    panel.className = 'mpanel' + (i === 0 ? ' active' : '');
    panel.id = `main-${key}`;
    panel.appendChild(buildPanel(key));
    mcontent.appendChild(panel);
  });

  // Main tab switching
  document.getElementById('mnav').addEventListener('click', e => {
    const btn = e.target.closest('.mbtn');
    if (!btn) return;
    document.querySelectorAll('.mbtn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.mpanel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`main-${btn.dataset.main}`).classList.add('active');
  });

  // Sub-tab switching (delegated)
  mcontent.addEventListener('click', e => {
    const btn = e.target.closest('.sbtn');
    if (!btn) return;
    const mainKey = btn.dataset.main;
    document.querySelectorAll(`#snav-${mainKey} .sbtn`).forEach(b => b.classList.remove('active'));
    document.querySelectorAll(`#main-${mainKey} .stbody`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`subtab-${mainKey}-${btn.dataset.sub}`).classList.add('active');
  });

  // Checkbox
  document.addEventListener('change', e => {
    if (!e.target.classList.contains('vchk')) return;
    e.target.closest('tr').classList.toggle('learned', e.target.checked);
    save(); updateStats();
  });

  loadState();
  updateStats();
}


/* ── WEB SPEECH API ── */
let currentUtterance = null;
let currentBtn = null;

function speakWord(btn) {
  if (!window.speechSynthesis) {
    alert('Ihr Browser unterstützt keine Sprachausgabe.');
    return;
  }

  const word = btn.dataset.word;

  // If same button clicked while speaking → stop
  if (currentBtn === btn && window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    btn.classList.remove('speaking');
    btn.textContent = '🔊';
    currentBtn = null;
    return;
  }

  // Stop any ongoing speech
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    if (currentBtn) {
      currentBtn.classList.remove('speaking');
      currentBtn.textContent = '🔊';
    }
  }

  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'de-DE';
  utter.rate = 0.85;
  utter.pitch = 1;

  // Try to pick a German voice
  const voices = window.speechSynthesis.getVoices();
  const deVoice = voices.find(v => v.lang.startsWith('de')) || null;
  if (deVoice) utter.voice = deVoice;

  utter.onstart = () => {
    btn.classList.add('speaking');
    btn.textContent = '🔉';
    currentBtn = btn;
  };
  utter.onend = () => {
    btn.classList.remove('speaking');
    btn.textContent = '🔊';
    currentBtn = null;
  };
  utter.onerror = () => {
    btn.classList.remove('speaking');
    btn.textContent = '🔊';
    currentBtn = null;
  };

  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

// Preload voices (some browsers load them async)
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}


/* ── Stats ── */
function updateStats() {
  let totalAll = 0, checkedAll = 0;

  Object.keys(DATA).forEach(mainKey => {
    DATA[mainKey].tabs.forEach(tab => {
      const tbl = document.getElementById(`tbl-${mainKey}-${tab.id}`);
      if (!tbl) return;
      const rows = tbl.querySelectorAll('tbody tr:not(.grp)').length;
      const done = tbl.querySelectorAll('.vchk:checked').length;
      const pct = rows ? Math.round(done / rows * 100) : 0;
      const mt = document.getElementById(`mt-${mainKey}-${tab.id}`);
      const mp = document.getElementById(`mp-${mainKey}-${tab.id}`);
      const ctr = document.getElementById(`ctr-${mainKey}-${tab.id}`);
      if (mt) mt.textContent = `${done}/${rows}`;
      if (mp) mp.style.width = pct + '%';
      if (ctr) ctr.textContent = done > 0 ? `${done}/${rows}` : rows;
      totalAll += rows;
      checkedAll += done;
    });
  });

  document.getElementById('tc').textContent = `${totalAll} واژه`;
  const pct = totalAll ? Math.round(checkedAll / totalAll * 100) : 0;
  document.getElementById('pb').style.width = pct + '%';
  document.getElementById('pl').textContent = pct + '%';
}

/* ── Persist ── */
function save() {
  const s = {};
  document.querySelectorAll('.vchk').forEach((c, i) => { s[i] = c.checked; });
  try { localStorage.setItem('dvok5', JSON.stringify(s)); } catch (e) {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('dvok5') || '{}');
    document.querySelectorAll('.vchk').forEach((c, i) => {
      if (s[i]) { c.checked = true; c.closest('tr').classList.add('learned'); }
    });
  } catch (e) {}
}

function resetAll() {
  if (!confirm('Reset?\nپیشرفت‌ها پاک شود؟')) return;
  document.querySelectorAll('.vchk').forEach(c => {
    c.checked = false;
    c.closest('tr').classList.remove('learned');
  });
  try { localStorage.removeItem('dvok5'); } catch (e) {}
  updateStats();
}

init();

</script>
